x-zk: &zk
  image: zookeeper:3.8.4
  restart: unless-stopped
  environment: &zk-env
    ZOO_SERVERS: server.1=zoo1:2888:3888;2181 server.2=zoo2:2888:3888;2181 server.3=zoo3:2888:3888;2181
    ZOO_TICK_TIME: 2000
    ZOO_INIT_LIMIT: 5
    ZOO_SYNC_LIMIT: 2
    ZOO_4LW_COMMANDS_WHITELIST: srvr,stat,mntr,ruok,cons

services:
  zoo1:
    <<: *zk
    container_name: zk-zoo1
    hostname: zoo1
    ports: ['2181:2181']
    environment: { <<: *zk-env, ZOO_MY_ID: 1 }

  zoo2:
    <<: *zk
    container_name: zk-zoo2
    hostname: zoo2
    ports: ['2182:2181']
    environment: { <<: *zk-env, ZOO_MY_ID: 2 }

  zoo3:
    <<: *zk
    container_name: zk-zoo3
    hostname: zoo3
    ports: ['2183:2181']
    environment: { <<: *zk-env, ZOO_MY_ID: 3 }

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: zk-kafka1
    depends_on: [zoo1, zoo2, zoo3]
    ports: ['9093:9093']
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zoo1:2181,zoo2:2181,zoo3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: zk-kafka2
    depends_on: [zoo1, zoo2, zoo3]
    ports: ['9094:9094']
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zoo1:2181,zoo2:2181,zoo3:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on: [kafka1, kafka2]
    ports: ['8080:8080']
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092