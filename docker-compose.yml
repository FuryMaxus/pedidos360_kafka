# Kafka local para Pedidos360: 3 ZooKeeper + 3 brokers + Kafka UI.
#
# ZooKeeper en ensamble de 3 nodos: si cae uno, los otros dos siguen formando mayoría (quórum)
# y el clúster puede seguir eligiendo líderes y creando tópicos.
#
# Puertos:
#   9092, 9093, 9094 -> brokers para el código Node en el computador (localhost)
#   29092            -> brokers para otros contenedores de la red Docker (Kafka UI)
#   8080             -> Kafka UI

name: pedidos360-kafka

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.5.0
  restart: unless-stopped

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5
  ZOOKEEPER_SYNC_LIMIT: 2
  # Los 3 nodos del ensamble (2888: sincronización, 3888: elección de líder)
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.5.0
  depends_on: [zookeeper1, zookeeper2, zookeeper3]
  restart: unless-stopped
  healthcheck:
    test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1']
    interval: 10s
    timeout: 10s
    start_period: 30s
    retries: 12

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  # Los tópicos los crea el servicio admin con su configuración versionada.
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  # Tópico interno de offsets de los consumer groups: también con 3 copias.
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  # Cada 30 s el broker revisa qué segmentos borrar por retención (por defecto 5 min).
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

services:
  zookeeper1:
    <<: *zookeeper
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes: [zk-data:/var/lib/zookeeper/data, zk-log:/var/lib/zookeeper/log]

  zookeeper2:
    <<: *zookeeper
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes: [zk2-data:/var/lib/zookeeper/data, zk2-log:/var/lib/zookeeper/log]

  zookeeper3:
    <<: *zookeeper
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes: [zk3-data:/var/lib/zookeeper/data, zk3-log:/var/lib/zookeeper/log]

  kafka1:
    <<: *kafka
    ports: ['9092:9092']
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9092
    volumes: [kafka1-data:/var/lib/kafka/data]

  kafka2:
    <<: *kafka
    ports: ['9093:9093']
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9093
    volumes: [kafka2-data:/var/lib/kafka/data]

  kafka3:
    <<: *kafka
    ports: ['9094:9094']
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_HOST:-localhost}:9094
    volumes: [kafka3-data:/var/lib/kafka/data]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports: ['8080:8080']
    depends_on:
      kafka1: { condition: service_healthy }
      kafka2: { condition: service_healthy }
      kafka3: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: pedidos360
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092

volumes:
  zk-data:      # zookeeper1 (conserva el nombre original para no perder los datos)
  zk-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
